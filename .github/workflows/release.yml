name: Publish to crates.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release tag and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "rpm-utils"))')
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo 'Run this workflow on a version tag matching Cargo.toml.' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          passed=$(gh run list --workflow rust.yml --commit "$GITHUB_SHA" --event push --limit 100 \
            --json status,conclusion --jq 'any(.[]; .status == "completed" and .conclusion == "success")')
          if [ "$passed" != true ]; then
            echo 'The Rust workflow must pass on this exact commit before publication.' >&2
            exit 1
          fi
      - name: Validate the distributable crate and installed CLI
        run: python3 tools/check-package.py
      - name: Check publication without uploading
        run: cargo publish --dry-run --locked

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
