[package]
name = "rpm-utils"
version = "0.2.0"
authors = ["Andrii Radyk <ander.ender@gmail.com>"]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Read, build, compare, edit, and lint RPM packages and CPIO archives"
repository = "https://github.com/AnderEnder/rpm-utils-rs"
documentation = "https://docs.rs/rpm-utils"
readme = "README.md"
keywords = ["rpm", "cpio", "packaging", "linux", "cli"]
categories = ["command-line-utilities", "development-tools::build-utils", "parser-implementations"]
autobins = false
include = ["/src/**", "/tests/**", "/docs/**", "/README.md", "/LICENSE", "/CHANGELOG.md", "/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml"]

[package.metadata.docs.rs]
no-default-features = true

[features]
default = ["cli"]
cli = ["dep:clap", "dep:serde_json"]

[[bin]]
name = "cargo-rpm-build"
path = "src/bin/cargo-rpm-build.rs"
required-features = ["cli"]

[[bin]]
name = "cpio-create"
path = "src/bin/cpio-create.rs"
required-features = ["cli"]

[[bin]]
name = "cpio-extract"
path = "src/bin/cpio-extract.rs"
required-features = ["cli"]

[[bin]]
name = "rpm-build"
path = "src/bin/rpm-build.rs"
required-features = ["cli"]

[[bin]]
name = "rpm-diff"
path = "src/bin/rpm-diff.rs"
required-features = ["cli"]

[[bin]]
name = "rpm-edit"
path = "src/bin/rpm-edit.rs"
required-features = ["cli"]

[[bin]]
name = "rpm-info"
path = "src/bin/rpm-info.rs"
required-features = ["cli"]

[[bin]]
name = "rpm-lint"
path = "src/bin/rpm-lint.rs"
required-features = ["cli"]

[[bin]]
name = "rpm2cpio"
path = "src/bin/rpm2cpio.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.6", features = ["derive"], optional = true }
num-derive = "0.4"
num-traits = "0.2"
strum_macros = "0.28.0"
chrono = "0.4"
flate2 = "1"
bzip2 = "0.6"
zstd = "0.13"
xz2 = "0.1"
hex = "0.4"
filetime = "0.2"
omnom = "3"
hostname = "0.4"
bitflags = "2"
log = "0.4"

sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
toml = "1.1.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["user", "fs"] }

[dev-dependencies]
serde_json = "1"
