[package]
name = "rpm-utils"
version = "0.2.0"
authors = ["Andrii Radyk <ander.ender@gmail.com>"]
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
num-derive = "0.4"
num-traits = "0.2"
strum_macros = "0.28.0"
chrono = "0.4"
flate2 = "1"
bzip2 = "0.6"
zstd = "0.13"
xz2 = "0.1"
hex = "0.4"
filetime = "0.2"
omnom = "3"
hostname = "0.4"
bitflags = "2"
log = "0.4"

sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["user", "fs"] }
